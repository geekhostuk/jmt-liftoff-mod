name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag and version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The tag is the release's public identity; <Version> is what gets compiled
          # into the DLL and reported to the competition server. If they disagree,
          # the release lies about which build it is.
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match <Version> $version in Directory.Build.props"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          version='${{ steps.v.outputs.version }}'
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section to release from"
            exit 1
          fi
          cat >> RELEASE_NOTES.md <<EOF

          ---

          ### Installing

          Download \`JmtLiftoffMod.dll\` below and drop it into your \`Liftoff\BepInEx\plugins\` folder,
          then set \`ServerUrl\` and \`ApiKey\` in the generated config. Full instructions:
          [docs/install.md](https://github.com/${{ github.repository }}/blob/${{ steps.v.outputs.tag }}/docs/install.md).

          The plugin is plain IL targeting .NET Framework 4.7.2, so the same DLL runs
          under BepInEx on both the Windows and the native Linux builds of the game.

          Verify your download against \`SHA256SUMS.txt\`:

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ### Building it yourself

          Binaries are built and uploaded from a machine that owns a copy of Liftoff —
          the game's copyrighted assemblies cannot be shipped to CI, so this workflow
          publishes the release and the DLL is attached separately. To build your own
          against your Steam copy, see
          [docs/building.md](https://github.com/${{ github.repository }}/blob/${{ steps.v.outputs.tag }}/docs/building.md).
          EOF
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.v.outputs.tag }}' \
            --title 'JMT Liftoff Mod ${{ steps.v.outputs.version }}' \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

  # NOTE: there is deliberately no DLL-building job here.
  #
  # A GitHub-hosted runner has no copy of Liftoff, and the game's managed assemblies
  # must never be committed to this repo. A self-hosted runner with the game installed
  # would work technically, but attaching one to a PUBLIC repository lets any fork's
  # pull request execute code on that machine — not a trade worth making for a build.
  #
  # The release binary is therefore built locally and uploaded with
  # scripts/release-dll.sh. See docs/versioning.md#release-assets.
